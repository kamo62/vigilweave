name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements-dev.txt

      - name: Lint backend
        run: |
          source .venv/bin/activate
          ruff check app tests scripts

      - name: Run backend tests (non-e2e)
        run: |
          source .venv/bin/activate
          pytest -m "not e2e"

      - name: Run backend e2e tests
        run: |
          source .venv/bin/activate
          pytest -m e2e

  frontend:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend typecheck
        run: bun run typecheck

      - name: Frontend lint
        run: bun run lint

      - name: Frontend tests
        run: bun run test

      - name: Frontend build
        run: bun run build

  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build (default)
        run: docker compose build

      - name: Docker build (enterprise runtime)
        run: docker compose -f docker-compose.yml -f docker-compose.enterprise.yml build
