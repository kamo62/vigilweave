[project]
name = "vigilweave-mcp"
version = "0.1.0"
license = { text = "MIT" }
description = "MCP server for VigilWeave — exposes scan, finding, and project tools to AI assistants"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
vigilweave-mcp = "vigilweave_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
